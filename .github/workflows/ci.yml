name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (libvips)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips42 libvips-tools

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable + dev)
        run: python -m pip install -e ".[dev]"

      - name: Check pyvips imports
        run: python -c "import pyvips; print(pyvips.version(0), pyvips.version(1), pyvips.version(2))"

      - name: Run tests
        env:
          SATMAP_LIVE_TESTS: "0"
          NO_COLOR: "1"
          TERM: dumb
          COLUMNS: "200"
          FORCE_COLOR: "0"
        run: pytest
