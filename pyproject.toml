[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "satmap-dataset"
version = "0.1.0"
description = "Year-aware multi-provider orthophoto dataset builder with JSON manifests."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Maciej" }]
keywords = ["orthophoto", "remote-sensing", "geoportal", "dataset", "ml"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "httpx",
  "aiofiles",
  "numpy",
  "pydantic>=2",
  "pyproj",
  "typer",
  "rich",
  "Pillow",
  "pyvips",
  "tifffile",
  "imagecodecs",
  "PyYAML",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]
studio = [
  "streamlit>=1.30",
  "streamlit-folium>=0.6",
  "folium>=0.15",
]

[project.urls]
Homepage = "https://github.com/macnack/satmap_dataset"
Issues = "https://github.com/macnack/satmap_dataset/issues"

[project.scripts]
satmap-dataset = "satmap_dataset.cli:main"
summary-locations = "satmap_dataset.cli:summary_locations_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"satmap_dataset.raw_tiles" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "live: hits external network services (opt-in via SATMAP_LIVE_TESTS=1)",
]
